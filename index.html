<html lang="fa" dir="rtl">
<head>

<style>
:root{--bg:#F2F6F8;--surface:#FFFFFF;--ink:#0F2F3E;--muted:#587383;--line:#DAE5EA;--brand:#0A7EA4;--on-brand:#FFFFFF;--brand-soft:#E0F0F6;--warn:#A25A09;--warn-soft:#FBEDD7;--bad:#B3342A;--bad-soft:#FBE4E1;--good:#1A7F5B;--good-soft:#D9F1E7;--shadow:0 8px 30px rgba(15,47,62,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1920;--surface:#122732;--ink:#E5EFF3;--muted:#8DA6B3;--line:#21394680;--brand:#3DB7DC;--on-brand:#04212B;--brand-soft:#133545;--warn:#E5A653;--warn-soft:#3A2D17;--bad:#F27D70;--bad-soft:#3B201D;--good:#52C99A;--good-soft:#143629;--shadow:0 8px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0B1920;--surface:#122732;--ink:#E5EFF3;--muted:#8DA6B3;--line:#21394680;--brand:#3DB7DC;--on-brand:#04212B;--brand-soft:#133545;--warn:#E5A653;--warn-soft:#3A2D17;--bad:#F27D70;--bad-soft:#3B201D;--good:#52C99A;--good-soft:#143629;--shadow:0 8px 30px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.7}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
bdi.n{unicode-bidi:isolate;direction:ltr;font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:900px;margin:0 auto;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-size:1.05rem;line-height:1.3}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.icon{background:none;border:0;padding:8px;border-radius:10px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px}
.icon:hover{background:var(--brand-soft);color:var(--brand)}
.icon.bad:hover{background:var(--bad-soft);color:var(--bad)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 6px;font-size:.76rem;color:var(--muted);background:none;border:0;border-top:3px solid transparent}
nav.tabs button.on{color:var(--brand);border-top-color:var(--brand);font-weight:700}
@media (min-width:900px){nav.tabs{position:static;max-width:900px;margin:0 auto;border:0;padding:0 8px}nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:.95rem;padding:10px 6px;border-top:0;border-bottom:3px solid transparent}nav.tabs button.on{border-bottom-color:var(--brand)}}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card.flat{padding:0;overflow:hidden}
h2.sec{font-size:1.08rem;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.count{background:var(--brand);color:var(--on-brand);border-radius:99px;font-size:.8rem;padding:0 9px;line-height:1.6}
.hello{margin:4px 2px 12px}
.hello h1{font-size:1.3rem}
.hello p{color:var(--muted);font-size:.92rem}
.stats{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats>div{padding:12px 14px;border-bottom:1px solid var(--line)}
.stats>div:nth-child(even){border-inline-start:1px solid var(--line)}
.stats>div:nth-last-child(-n+2){border-bottom:0}
.stats span{display:block;color:var(--muted);font-size:.82rem}
.stats b{font-size:1.25rem}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.stats>div{border-bottom:0;border-inline-start:1px solid var(--line)!important}.stats>div:first-child{border-inline-start:0!important}}
.rem{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--brand);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rem.late{border-inline-start-color:var(--warn)}
.rem.today{border-inline-start-color:var(--brand)}
.rem h3{font-size:1.05rem}
.rem .addr{color:var(--muted);font-size:.9rem}
.rem .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rem .act{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:99px;font-size:.82rem;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;min-height:42px;text-decoration:none;font-size:.95rem}
.btn:hover{border-color:var(--brand)}
.btn.p{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700}
.btn.d{color:var(--bad)}
.btn.sm{min-height:36px;padding:4px 11px;font-size:.88rem}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--brand);padding:2px 0;text-decoration:underline;font-size:.92rem}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;font-size:.92rem;min-height:38px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--brand-soft)}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:.85rem;line-height:1.5}
.amt{text-align:end;white-space:nowrap}
.acts{display:flex;gap:0}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.note{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.92rem}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--brand-soft);color:var(--brand)}
.daynav{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.daynav .day{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;min-height:44px}
.daynav .day small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.two .btn{width:100%}
label{display:block;font-size:.88rem;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dfield{display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:6px}
.dfield select{padding-inline:6px}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.step button{border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:1.3rem;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:.88rem;min-height:34px}
.chips button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sum{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.sum .big{font-weight:700;font-size:1.05rem}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
.ov{position:fixed;inset:0;background:rgba(6,22,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mh h2{font-size:1.15rem}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;z-index:90;font-size:.92rem;max-width:90%}
.bars{height:7px;background:var(--brand-soft);border-radius:4px;margin-top:5px;overflow:hidden}
.bars i{display:block;height:100%;background:var(--brand);border-radius:4px}
.rank{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.88rem;flex:none}
.stmt{padding:4px 14px 10px}
.stmt .ln{display:flex;align-items:baseline;gap:8px;padding:7px 0}
.stmt .ln span.l{flex:none}
.stmt .ln i{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.stmt .ln.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font-weight:700}
.stmt .ln.tot.final{font-size:1.15rem}
.pos{color:var(--good)}.neg{color:var(--bad)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.c-daily{background:var(--warn)}.c-emp{background:var(--brand)}.c-tech{background:var(--bad)}.c-profit{background:var(--good)}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.logo-lg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 0}
.receipt{padding:6px 2px}
.receipt .rh{text-align:center;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.receipt .rl{display:flex;justify-content:space-between;padding:3px 0}
.receipt .rs{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
pre.txt{white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;background:var(--bg);padding:10px;border-radius:10px;max-height:220px;overflow:auto;font-size:.8rem}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;inset:0;padding:16px;background:#fff;color:#000}.sheet{box-shadow:none}}
</style>
</head>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const s=String(v==null?'':v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬،\s]/g,'').replace('٫','.');const n=parseFloat(s);return isFinite(n)?n:0;};
const money=n=>{n=Math.round(num(n)*100)/100;return n.toLocaleString('en-US',{maximumFractionDigits:2});};
const M$=n=>'<bdi class="n">'+money(n)+'</bdi>';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const MONTHS=['حمل','ثور','جوزا','سرطان','اسد','سنبله','میزان','عقرب','قوس','جدی','دلو','حوت'];
const GM=['جنوری','فبروری','مارچ','اپریل','می','جون','جولای','اگست','سپتمبر','اکتوبر','نومبر','دسمبر'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy;if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}const gy2=gm>2?gy+1:gy;let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){let gy;if(jy>979){gy=1600;jy-=979}else{gy=621}let days=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:((jm-7)*30)+186);gy+=400*Math.floor(days/146097);days%=146097;if(days>36524){days--;gy+=100*Math.floor(days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sal=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13;gm++){const v=sal[gm];if(gd<=v)break;gd-=v}return[gy,gm,gd]}
const toJ=s=>{const d=parse(s);return g2j(d.getFullYear(),d.getMonth()+1,d.getDate());};
const fromJ=(y,m,d)=>{const g=j2g(y,m,d);return g[0]+'-'+pad(g[1])+'-'+pad(g[2]);};
const shamsi=()=>S.settings.cal!=='miladi';
function fmtDate(s,short){if(!s)return '—';const p=s.split('-').map(Number);if(!shamsi())return p[2]+' '+GM[p[1]-1]+(short?'':' '+p[0]);const j=g2j(p[0],p[1],p[2]);return j[2]+' '+MONTHS[j[1]-1]+(short?'':' '+j[0]);}
const fmtLong=s=>WD[parse(s).getDay()]+'، '+fmtDate(s);
function ago(s){const n=diff(today(),s);return n===0?'امروز':n===1?'دیروز':n+' روز پیش';}
function dateField(id,val){
  if(!shamsi())return '<input type="date" id="'+id+'" value="'+val+'">';
  const j=toJ(val),cy=toJ(today())[0];let ys='',ds='',ms='';
  for(let y=Math.min(cy-4,j[0]);y<=Math.max(cy+1,j[0]);y++)ys+='<option value="'+y+'"'+(y===j[0]?' selected':'')+'>'+y+'</option>';
  for(let d=1;d<=31;d++)ds+='<option value="'+d+'"'+(d===j[2]?' selected':'')+'>'+d+'</option>';
  MONTHS.forEach((m,i)=>ms+='<option value="'+(i+1)+'"'+(i+1===j[1]?' selected':'')+'>'+m+'</option>');
  return '<div class="dfield" id="'+id+'"><select class="d" aria-label="روز">'+ds+'</select><select class="m" aria-label="ماه">'+ms+'</select><select class="y" aria-label="سال">'+ys+'</select></div>';
}
function getDate(id){
  const el=document.getElementById(id);if(!el)return today();
  if(el.tagName==='INPUT')return el.value||today();
  const y=+el.querySelector('.y').value,m=+el.querySelector('.m').value;let d=+el.querySelector('.d').value;
  for(;d>=1;d--){const g=fromJ(y,m,d);if(toJ(g)[1]===m)return g;}
  return fromJ(y,m,1);
}
function range(p){
  const t=today();
  if(p==='today')return[t,t];
  if(p==='all')return['0000-01-01','9999-12-31'];
  if(p==='week'){const off=(parse(t).getDay()+1)%7;const f=addDays(t,-off);return[f,addDays(f,6)];}
  const sh=shamsi();
  if(p==='month'||p==='lastmonth'){
    if(sh){let j=toJ(t),y=j[0],m=j[1];if(p==='lastmonth'){m--;if(m<1){m=12;y--;}}const f=fromJ(y,m,1);const ny=m===12?y+1:y,nm=m===12?1:m+1;return[f,addDays(fromJ(ny,nm,1),-1)];}
    const d=parse(t);let y=d.getFullYear(),m=d.getMonth();if(p==='lastmonth'){m--;if(m<0){m=11;y--;}}
    return[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))];
  }
  if(p==='year'){if(sh){const y=toJ(t)[0];return[fromJ(y,1,1),addDays(fromJ(y+1,1,1),-1)];}const y=parse(t).getFullYear();return[y+'-01-01',y+'-12-31'];}
  return[t,t];
}
const PERIODS=[['today','امروز'],['week','این هفته'],['month','این ماه'],['lastmonth','ماه گذشته'],['year','امسال'],['all','همه']];

const sdate0=v=>/^\d{4}-\d{2}-\d{2}$/.test(str(v))?str(v):'';
function normalize(o){
  o=o&&typeof o==='object'?o:{};
  const st=Object.assign({},DEF,o.settings&&typeof o.settings==='object'?o.settings:{});
  ['price','cost','days','inactive'].forEach(k=>st[k]=num(st[k]));st.lastBackup=sdate0(st.lastBackup);if(['shamsi','miladi'].indexOf(st.cal)<0)st.cal='shamsi';if(['auto','light','dark'].indexOf(st.theme)<0)st.theme='auto';
  const arr=k=>Array.isArray(o[k])?o[k].filter(x=>x&&typeof x==='object'&&x.id):[];
  return{v:1,settings:st,
    customers:arr('customers').map(c=>({id:sid(c.id),name:str(c.name),phone:str(c.phone),address:str(c.address),type:TYPES[c.type]?c.type:'home',price:c.price===null||c.price===''||c.price===undefined?null:num(c.price),days:c.days===null||c.days===''||c.days===undefined?null:num(c.days),openDebt:num(c.openDebt),openBottles:num(c.openBottles),note:str(c.note),created:sdate(c.created),snooze:sdate0(c.snooze),mute:!!c.mute})),
    sales:arr('sales').map(s=>({id:sid(s.id),ts:num(s.ts),cid:sid(s.cid),date:sdate(s.date),qty:num(s.qty),ret:num(s.ret),price:num(s.price),paid:num(s.paid),days:num(s.days),note:str(s.note)})),
    payments:arr('payments').map(p=>({id:sid(p.id),ts:num(p.ts),cid:sid(p.cid),date:sdate(p.date),amount:num(p.amount),note:str(p.note)})),
    expenses:arr('expenses').map(e=>({id:sid(e.id),ts:num(e.ts),date:sdate(e.date),type:ET[e.type]?e.type:'daily',name:str(e.name),desc:str(e.desc),amount:num(e.amount)}))};
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r));}catch(e){}return normalize({});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}}
function compute(){
  const C={};
  S.customers.forEach(c=>{C[c.id]={c:c,bottles:c.openBottles||0,bal:c.openDebt||0,last:'',lastQty:0,days:0,qty:0,amt:0,n:0,due:''};});
  S.sales.slice().sort((a,b)=>a.date===b.date?(a.ts||0)-(b.ts||0):(a.date<b.date?-1:1)).forEach(s=>{
    const x=C[s.cid];if(!x)return;
    x.bottles+=s.qty-(s.ret||0);x.bal+=s.qty*s.price-s.paid;
    if(s.qty>0){x.last=s.date;x.lastQty=s.qty;x.days=s.days;x.qty+=s.qty;x.amt+=s.qty*s.price;x.n++;}
  });
  S.payments.forEach(p=>{const x=C[p.cid];if(x)x.bal-=p.amount;});
  Object.keys(C).forEach(k=>{const x=C[k];x.bal=Math.round(x.bal*100)/100;if(x.last&&x.days>0&&!x.c.mute){x.due=addDays(x.last,x.days);if(x.c.snooze&&x.c.snooze>x.due)x.due=x.c.snooze;}});
  return C;
}
function applyTheme(){const t=S.settings.theme;if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');}

const VIEWS={home:vHome,sales:vSales,customers:vCustomers,expenses:vExpenses,finance:vFinance,settings:vSettings};

function remCard(x,t){
  const c=x.c,late=diff(t,x.due);
  const st=late<=0?'<span class="chip">امروز</span>':'<span class="chip warn">'+late+' روز تأخیر</span>';
  return '<article class="rem '+(late>0?'late':'today')+'"><div style="display:flex;justify-content:space-between;gap:8px"><div class="grow"><h3>'+esc(c.name)+'</h3><p class="addr">'+esc(c.address||'آدرس ثبت نشده')+'</p></div>'+st+'</div>'
  +'<div class="meta"><span class="chip mute">نزد مشتری: '+money(x.bottles)+' بوتل</span><span class="chip mute">آخرین خرید: '+ago(x.last)+'</span>'+(x.bal>0.004?'<span class="chip bad">باقی '+money(x.bal)+' '+cur()+'</span>':'')+'</div>'
  +'<div class="act"><button class="btn p sm" data-a="saleNew" data-id="'+c.id+'">'+ic('check',16)+'ثبت فروش</button>'
  +(c.phone?'<a class="btn sm" href="'+telHref(c.phone)+'">'+ic('phone',16)+'<span class="ltr">'+esc(c.phone)+'</span></a><a class="btn sm" target="_blank" rel="noopener" href="'+waHref(c.phone)+'" aria-label="واتساپ">'+ic('chat',16)+'</a>':'')
  +'<button class="btn sm" data-a="snooze" data-id="'+c.id+'">'+ic('clock',16)+'بعداً</button></div></article>';
}
const cur=()=>esc(S.settings.currency);
function vHome(){
  const t=today(),D=Object.values(CC);
  const cmp=(a,b)=>a.due<b.due?-1:a.due>b.due?1:byName(a.c,b.c);
  const due=D.filter(x=>x.due&&x.due<=t).sort(cmp);
  const soon=D.filter(x=>x.due&&x.due>t&&x.due<=addDays(t,3)).sort(cmp);
  const ts=S.sales.filter(s=>s.date===t);
  const q=sum(ts,s=>s.qty),amt=sum(ts,s=>s.qty*s.price),got=sum(ts,s=>s.paid)+sum(S.payments.filter(p=>p.date===t),p=>p.amount);
  const recv=D.reduce((a,x)=>a+Math.max(0,x.bal),0);
  let h='';
  if(!storageOK)h+='<div class="note bad">ذخیره خودکار در این مرورگر کار نمی‌کند. حتماً مرتب بکاپ بگیرید.</div>';
  const has=S.sales.length+S.expenses.length+S.customers.length>0,lb=S.settings.lastBackup;
  if(has&&(!lb||diff(t,lb)>=7))h+='<div class="note warn">'+(lb?'آخرین بکاپ '+diff(t,lb)+' روز پیش گرفته شده.':'هنوز از اطلاعات بکاپ نگرفته‌اید.')+' اطلاعات فقط روی همین دستگاه ذخیره می‌شود. <button class="link" data-a="exportJSON">بکاپ بگیرید</button></div>';
  if(!(S.settings.price>0))h+='<div class="note info">قیمت پیش‌فرض یک بوتل را در <button class="link" data-a="go" data-v="settings">تنظیمات</button> وارد کنید تا هنگام فروش خودکار پر شود.</div>';
  h+='<div class="hello"><h1>'+fmtLong(t)+'</h1><p>'+esc(S.settings.company)+'</p></div>';
  h+='<div class="stats"><div><span>بوتل فروخته امروز</span><b>'+M$(q)+'</b></div><div><span>مبلغ فروش امروز</span><b>'+M$(amt)+'</b> <small>'+cur()+'</small></div><div><span>وصول امروز</span><b>'+M$(got)+'</b> <small>'+cur()+'</small></div><div><span>مجموع قرض مشتریان</span><b>'+M$(recv)+'</b> <small>'+cur()+'</small></div></div>';
  h+='<h2 class="sec">یادآوری امروز <span class="count">'+due.length+'</span></h2>';
  if(!S.customers.length)h+='<div class="card"><p>برای شروع، اولین مشتری را اضافه کنید. بعد از ثبت اولین فروش، یادآوری‌ها اینجا نمایش داده می‌شوند.</p><div style="margin-top:12px"><button class="btn p" data-a="custNew">'+ic('plus',16)+'مشتری جدید</button></div></div>';
  else if(!due.length)h+='<div class="card">'+empty('امروز مشتری‌ای برای رساندن آب باقی نمانده است.')+'</div>';
  else h+=due.map(x=>remCard(x,t)).join('');
  if(soon.length){h+='<h2 class="sec">در سه روز آینده</h2><div class="card flat">'+soon.map(x=>'<div class="row click" data-a="custOpen" data-id="'+x.c.id+'"><div class="grow"><b>'+esc(x.c.name)+'</b><div class="sub">'+esc(x.c.address)+'</div></div><span class="chip mute">'+fmtDate(x.due,true)+'</span></div>').join('')+'</div>';}
  return h;
}

function vSales(){
  const d=UI.saleDate,t=today();
  const ss=S.sales.filter(s=>s.date===d).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const ps=S.payments.filter(p=>p.date===d);
  const q=sum(ss,s=>s.qty),ret=sum(ss,s=>s.ret),tot=sum(ss,s=>s.qty*s.price),paid=sum(ss,s=>s.paid),pay=sum(ps,p=>p.amount);

  h+='<div class="two"><button class="btn p" data-a="saleNew" data-date="'+d+'">'+ic('plus',16)+'فروش جدید</button><button class="btn" data-a="payNew" data-date="'+d+'">'+ic('down',16)+'وصول قرض</button></div>';
  h+='<div class="stats"><div><span>بوتل فروخته</span><b>'+M$(q)+'</b>'+(ret?' <small>('+ret+' خالی برگشت)</small>':'')+'</div><div><span>مبلغ فروش</span><b>'+M$(tot)+'</b></div><div><span>پرداخت همان روز</span><b>'+M$(paid)+'</b></div><div><span>باقی‌داری امروز</span><b class="'+(tot-paid>0.004?'neg':'')+'">'+M$(tot-paid)+'</b></div></div>';
  h+='<h2 class="sec">فروش‌های این روز <span class="count">'+ss.length+'</span></h2><div class="card flat">';
  if(!ss.length)h+=empty('برای این روز فروشی ثبت نشده است.');
  h+=ss.map(s=>{const total=s.qty*s.price,rem=total-s.paid;return '<div class="row"><div class="grow"><b>'+esc(custName(s.cid))+'</b><div class="sub">'+(s.qty>0?money(s.qty)+' بوتل × '+money(s.price):'فقط بوتل خالی')+(s.ret?'، '+money(s.ret)+' خالی برگشت':'')+(s.note?'، '+esc(s.note):'')+'</div></div><div class="amt"><b>'+M$(total)+'</b><div class="sub">'+debtChip(rem)+'</div></div><div class="acts"><button class="icon" data-a="receipt" data-id="'+s.id+'" aria-label="رسید">'+ic('print',18)+'</button><button class="icon" data-a="saleEdit" data-id="'+s.id+'" aria-label="ویرایش">'+ic('edit',18)+'</button><button class="icon bad" data-a="saleDel" data-id="'+s.id+'" aria-label="حذف">'+ic('trash',18)+'</button></div></div>';}).join('');
  h+='</div>';
  if(ps.length){h+='<h2 class="sec">وصول قرض این روز <span class="chip good">'+money(pay)+' '+cur()+'</span></h2><div class="card flat">'+ps.map(p=>'<div class="row"><div class="grow"><b>'+esc(custName(p.cid))+'</b><div class="sub">'+esc(p.note||'پرداخت قرض')+'</div></div><div class="amt"><b class="pos">'+M$(p.amount)+'</b></div><div class="acts"><button class="icon" data-a="payEdit" data-id="'+p.id+'" aria-label="ویرایش">'+ic('edit',18)+'</button><button class="icon bad" data-a="payDel" data-id="'+p.id+'" aria-label="حذف">'+ic('trash',18)+'</button></div></div>').join('')+'</div>';}
  return h;

function custList(){
  const q=UI.q.trim().toLowerCase();
  const L=Object.values(CC).filter(x=>!q||(x.c.name+' '+x.c.phone+' '+x.c.address).toLowerCase().indexOf(q)>=0).sort((a,b)=>byName(a.c,b.c));
  if(!L.length)return empty(S.customers.length?'مشتری‌ای با این مشخصات پیدا نشد.':'هنوز مشتری ثبت نشده است.');
  return L.map(x=>'<div class="row click" data-a="custOpen" data-id="'+x.c.id+'"><div class="grow"><b>'+esc(x.c.name)+'</b><div class="sub">'+(x.c.phone?'<span class="ltr">'+esc(x.c.phone)+'</span> ':'')+esc(x.c.address)+'</div></div><div class="amt"><div class="sub">'+money(x.bottles)+' بوتل نزد مشتری</div>'+(Math.abs(x.bal)>0.004?debtChip(x.bal):'')+'</div></div>').join('');

function vCustomers(){
  const t=today(),D=Object.values(CC);
  let h='<div class="seg">'+[['all','همه مشتریان'],['top','پرمصرف‌ها'],['inactive','غیرفعال'],['debt','قرضدار']].map(o=>'<button data-a="set" data-k="cTab" data-v="'+o[0]+'" class="'+(UI.cTab===o[0]?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';
  if(UI.cTab==='all'){
    h+='<div style="display:flex;gap:8px;margin:4px 0 12px"><input id="cq" placeholder="جستجوی نام، شماره یا آدرس" value="'+esc(UI.q)+'" autocomplete="off"><button class="btn p" data-a="custNew" style="flex:none">'+ic('plus',16)+'جدید</button></div>';
    const out=sum(D,x=>x.bottles);
    h+='<div class="hint" style="margin:0 2px 8px">'+D.length+' مشتری، '+money(out)+' بوتل نزد مشتریان</div><div class="card flat" id="clist">'+custList()+'</div>';
  }else if(UI.cTab==='top'){
    const r=range(UI.topP),m={};
    S.sales.forEach(s=>{if(s.qty<=0||!inR(s.date,r)||!CC[s.cid])return;const o=m[s.cid]||(m[s.cid]={qty:0,amt:0,n:0});o.qty+=s.qty;o.amt+=s.qty*s.price;o.n++;});
    const L=Object.keys(m).map(k=>({c:CC[k].c,o:m[k]})).sort((a,b)=>b.o.qty-a.o.qty||b.o.amt-a.o.amt);
    const mx=L.length?L[0].o.qty:1,tq=sum(L,x=>x.o.qty),ta=sum(L,x=>x.o.amt);
    h+=chips('topP',UI.topP,PERIODS);

function finData(r){
  const ss=S.sales.filter(s=>inR(s.date,r)),ps=S.payments.filter(p=>inR(p.date,r)),es=S.expenses.filter(e=>inR(e.date,r));
  const qty=sum(ss,s=>s.qty),rev=sum(ss,s=>s.qty*s.price),paid=sum(ss,s=>s.paid),pay=sum(ps,p=>p.amount);
  const cost=qty*(S.settings.cost||0),gross=rev-cost;
  const e={};Object.keys(ET).forEach(k=>e[k]=sum(es.filter(x=>x.type===k),x=>x.amount));
  const net=gross-e.daily-e.tech-e.emp;
  return{qty,rev,paid,pay,cost,gross,e,net,left:net-e.profit,cash:paid+pay-(e.daily+e.tech+e.emp+e.profit)};
}
function buckets(r){
  const t=today();let f=r[0],to=r[1]>t?t:r[1];
  if(f<'1900'){const ds=S.sales.map(s=>s.date).concat(S.expenses.map(e=>e.date));f=ds.length?ds.reduce((a,b)=>a<b?a:b):t;}
  const B=[];
  if(diff(to,f)<=45){for(let d=f;d<=to;d=addDays(d,1)){const p=d.split('-').map(Number);B.push({f:d,t:d,l:String(shamsi()?toJ(d)[2]:p[2])});}return B;}
  if(shamsi()){let j=toJ(f),y=j[0],m=j[1];for(;;){const s=fromJ(y,m,1);if(s>to)break;const ny=m===12?y+1:y,nm=m===12?1:m+1;B.push({f:s,t:addDays(fromJ(ny,nm,1),-1),l:MONTHS[m-1]});y=ny;m=nm;}}
  else{const d=parse(f);let y=d.getFullYear(),m=d.getMonth();for(;;){const s=iso(new Date(y,m,1));if(s>to)break;B.push({f:s,t:iso(new Date(y,m+1,0)),l:GM[m].slice(0,3)});m++;if(m>11){m=0;y++;}}}
  return B.slice(-12);
}
function chart(r){
  const B=buckets(r);if(B.length<2)return '';
  B.forEach(b=>{b.s=sum(S.sales.filter(s=>s.date>=b.f&&s.date<=b.t),s=>s.qty*s.price);b.x=sum(S.expenses.filter(e=>e.date>=b.f&&e.date<=b.t&&e.type!=='profit'),e=>e.amount);});
  const mx=Math.max(1,...B.map(b=>Math.max(b.s,b.x))),W=600,H=170,pb=22,n=B.length,gw=W/n,bw=Math.min(22,gw*.34),step=Math.ceil(n/12);
  let g='';
  B.forEach((b,i)=>{const xr=W-(i+1)*gw+gw/2,hs=b.s/mx*(H-pb-10),hx=b.x/mx*(H-pb-10);
    g+='<rect x="'+(xr-bw-1)+'" y="'+(H-pb-hs)+'" width="'+bw+'" height="'+Math.max(hs,b.s>0?2:0)+'" rx="3" fill="var(--brand)"><title>'+b.l+' فروش: '+money(b.s)+'</title></rect>';
    g+='<rect x="'+(xr+1)+'" y="'+(H-pb-hx)+'" width="'+bw+'" height="'+Math.max(hx,b.x>0?2:0)+'" rx="3" fill="var(--warn)"><title>'+b.l+' مصارف: '+money(b.x)+'</title></rect>';
    if(i%step===0)g+='<text x="'+xr+'" y="'+(H-6)+'" text-anchor="middle">'+b.l+'</text>';});
  return '<h2 class="sec">روند فروش و مصارف</h2><div class="card"><svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="نمودار فروش و مصارف"><line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>'+g+'</svg><div class="hint"><span class="dot" style="background:var(--brand)"></span>فروش <span class="dot" style="background:var(--warn);margin-inline-start:12px"></span>مصارف (بدون برداشت مفاد) — بلندترین ستون: '+money(mx)+' '+cur()+'</div></div>';
}

function ledger(cid){
  const x=CC[cid],R=[];
  if(x.c.openDebt||x.c.openBottles)R.push({d:'',ts:0,txt:'مانده قبل از شروع',delta:x.c.openDebt||0,b:x.c.openBottles||0});
  S.sales.filter(s=>s.cid===cid).forEach(s=>R.push({d:s.date,ts:s.ts||0,txt:(s.qty>0?money(s.qty)+' بوتل × '+money(s.price)+' = '+money(s.qty*s.price):'برگشت بوتل خالی')+(s.ret&&s.qty>0?'، '+money(s.ret)+' خالی برگشت':'')+(s.paid?'، پرداخت '+money(s.paid):''),delta:s.qty*s.price-s.paid,b:s.qty-s.ret}));
  S.payments.filter(p=>p.cid===cid).forEach(p=>R.push({d:p.date,ts:p.ts||0,txt:'پرداخت قرض'+(p.note?' ('+p.note+')':''),delta:-p.amount,b:0}));
  R.sort((a,b)=>a.d===b.d?a.ts-b.ts:(a.d<b.d?-1:1));
  let run=0,bt=0;R.forEach(r=>{run+=r.delta;bt+=r.b;r.run=run;r.bt=bt;});
  return R.reverse();
}

/* ---------- export / import ---------- */
async function saveFile(name,data){
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:name,data:data});return true;}}
  catch(e){if(e&&e.code==='declined')return false;}
  if(!window.claude){
    try{
      if(/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)){
        const f=new File([data],name,{type:/\.csv$/.test(name)?'text/csv':'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true;}
      }
    }catch(e){if(e&&e.name==='AbortError')return false;}
  }
  if(!window.claude){try{const b=new Blob([data],{type:'application/octet-stream'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;}catch(e){}}
  openModal(mhead('متن فایل')+'<p class="sub" style="margin:8px 0">ذخیره مستقیم فایل در این حالت ممکن نیست. متن زیر را کاپی کنید و در یک فایل (مثلاً «'+esc(name)+'») نگه دارید.</p><textarea id="txtout" readonly style="direction:ltr;min-height:200px">'+esc(data)+'</textarea><button class="btn p wide" data-a="selTxt" style="margin-top:10px">انتخاب همه متن</button>');
  return false;
}

  custDel(d){const n=S.sales.filter(s=>s.cid===d.id).length;confirmBox('مشتری «'+custName(d.id)+'» با '+n+' فروش و همه پرداخت‌هایش برای همیشه حذف شود؟','حذف',()=>{S.customers=S.customers.filter(c=>c.id!==d.id);S.sales=S.sales.filter(s=>s.cid!==d.id);S.payments=S.payments.filter(p=>p.cid!==d.id);save();render();toast('حذف شد');});},
  snooze(d){snoozeForm(d.id);},
  snoozeSet(d){const c=S.customers.find(x=>x.id===d.id);if(d.v==='mute'){c.mute=true;}else{c.snooze=addDays(today(),+d.v);}save();closeModal();render();toast('انجام شد');},
  dayMove(d){UI.saleDate=addDays(UI.saleDate,+d.d);render();},
  dayToday(){UI.saleDate=today();render();},
  dayPick(){openModal(mhead('انتخاب تاریخ')+dateField('dp-date',UI.saleDate)+'<button class="btn p wide" style="margin-top:14px" data-a="dayGo">نمایش</button>');},
  dayGo(){UI.saleDate=getDate('dp-date');closeModal();render();},
  step(d){const el=$('#'+d.t);el.value=Math.max(0,num(el.value)+(+d.d));sfUpdate();},
  payFull(){const t=num($('#sf-qty').value)*num($('#sf-price').value);$('#sf-paid').value=t||'';sfUpdate();},
  payNone(){$('#sf-paid').value='0';sfUpdate();},
  payAll(){const x=CC[$('#pf-c').value];if(x){const id=$('#pf').dataset.id,old=id?S.payments.find(p=>p.id===id):null;$('#pf-amt').value=Math.max(0,x.bal+(old&&old.cid===x.c.id?old.amount:0));pfUpdate();}},
  setDays(d){$('#sf-days').value=d.v;sfUpdate();},
  sfSave,pfSave,cfSave,efSave,
  expNew(d){expForm(null,d.t);},expEdit(d){expForm(d.id);},
  expDel(d){confirmBox('این مورد حذف شود؟','حذف',()=>{S.expenses=S.expenses.filter(e=>e.id!==d.id);save();render();toast('حذف شد');});},
  etype(d){efType(d.v);},
  exportJSON,csv(d){csv(d.k);},
  selTxt(){const t=$('#txtout');if(t){t.focus();t.select();}},
  importFile(){$('#impfile').value='';$('#impfile').click();},
  importPaste(){openModal(mhead('وارد کردن از متن')+'<textarea id="pastein" placeholder="متن بکاپ را اینجا بچسبانید" style="direction:ltr;min-height:160px"></textarea><button class="btn p wide" style="margin-top:10px" data-a="pasteGo">ادامه</button>');},
  pasteGo(){const v=$('#pastein').value;closeModal();handleImport(v);},
  impMerge(){mergeIn(pendingImport);pendingImport=null;save();closeModal();render();toast('ادغام شد');},
  impReplace(){const n=pendingImport;pendingImport=null;confirmBox('همه اطلاعات فعلی این دستگاه پاک و با بکاپ جایگزین شود؟','جایگزین کن',()=>{S=n;save();render();toast('بکاپ بازیابی شد');});},
  wipe(){confirmBox('همه مشتریان، فروش‌ها و مصارف این دستگاه برای همیشه پاک شود؟ پیش از این کار حتماً بکاپ بگیرید.','پاک کن',()=>{const st=S.settings;S=normalize({settings:st});save();UI.view='home';render();toast('پاک شد');});}
};
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('ov')){closeModal();return;}
  const t=e.target.closest('[data-a]');if(!t)return;
  const f=A[t.dataset.a];if(f){e.preventDefault();f(t.dataset,t);}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sf-q')sfFilter();
  else if(t.closest&&t.closest('#sf'))sfUpdate();
  else if(t.closest&&t.closest('#pf'))pfUpdate();
  else if(t.id==='cq'){UI.q=t.value;$('#clist').innerHTML=custList();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sf-c'){sfPick(t.value);return;}
  if(t.closest&&t.closest('#sf')){sfUpdate();return;}
  if(t.closest&&t.closest('#pf')){pfUpdate();return;}
  if(t.id==='impfile'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>handleImport(String(r.result));r.onerror=()=>toast('خواندن فایل ممکن نشد');r.readAsText(f);return;}
  if(t.dataset&&t.dataset.s){const k=t.dataset.s;let v=t.value;if(t.dataset.n)v=num(v);S.settings[k]=v;save();if(['cal','theme','company','group','ceo','currency'].indexOf(k)>=0)render();else toast('ذخیره شد');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

S=load();UI.inact=S.settings.inactive||30;
render(false);
})();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
